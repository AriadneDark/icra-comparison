x-common: &common
  working_dir: /workspace
  volumes:
    - ../:/workspace
    # Large datasets may stay outside the repository. Override this host path
    # and use /input/scenes as BENCHMARK_SOURCE_ROOT inside the container.
    - ${BENCHMARK_HOST_SOURCE_ROOT:-../our_results/scenes}:/input/scenes:ro
    - ${HF_CACHE_DIR:-./.cache/huggingface}:/models/huggingface
    - ${TORCH_CACHE_DIR:-./.cache/torch}:/models/torch
  environment:
    HF_HOME: /models/huggingface
    TORCH_HOME: /models/torch
    SG_EGO_LOG_DIR: /workspace/baseline_runs/sg_ego/logs
    HF_TOKEN: ${HF_TOKEN:-}
    HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  ipc: host
  shm_size: 16gb

services:
  # Independent local VLM judge. Start it only after SG-Ego/SVG2 have released
  # the GPU: Gemma 4 31B BF16 uses most of an A100 80 GB.
  gemma-judge:
    image: ${GEMMA_JUDGE_IMAGE:-vllm/vllm-openai:v0.29.0-cu129}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/models/huggingface
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /models/huggingface/.cache
      HF_HOME: /models/huggingface
      VLLM_CACHE_ROOT: /models/huggingface/vllm
      TRITON_CACHE_DIR: /models/huggingface/triton
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "127.0.0.1:${GEMMA_JUDGE_PORT:-8000}:8000"
    command:
      - ${GEMMA_JUDGE_MODEL:-google/gemma-4-31B-it}
      - --dtype
      - bfloat16
      - --max-model-len
      - ${GEMMA_JUDGE_MAX_MODEL_LEN:-8192}
      - --max-num-seqs
      - ${GEMMA_JUDGE_MAX_NUM_SEQS:-1}
      - --gpu-memory-utilization
      - ${GEMMA_JUDGE_GPU_MEMORY_UTILIZATION:-0.95}
      - --limit-mm-per-prompt
      - '{"image": 10}'
      - --reasoning-parser
      - gemma4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    shm_size: 16gb

  sg-ego:
    <<: *common
    build:
      context: ..
      dockerfile: benchmark/docker/sg-ego.Dockerfile
    image: goal-role-sg-ego:cu126

  svg2:
    <<: *common
    build:
      context: ..
      dockerfile: benchmark/docker/svg2.Dockerfile
    image: goal-role-svg2:cu128
    environment:
      HF_HOME: /models/huggingface
      TORCH_HOME: /models/torch
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SVG2_API_KEY: ${SVG2_API_KEY:-}
      SVG2_API_KEY_ENV: ${SVG2_API_KEY_ENV:-}
      SVG2_API_BASE_URL: ${SVG2_API_BASE_URL:-}
      SVG2_API_MODEL: ${SVG2_API_MODEL:-}
      SVG2_API_CONCURRENCY: ${SVG2_API_CONCURRENCY:-4}
      EVAL_VLM_API_KEY: ${EVAL_VLM_API_KEY:-}
      EVAL_VLM_BASE_URL: ${EVAL_VLM_BASE_URL:-}
      EVAL_VLM_MODEL: ${EVAL_VLM_MODEL:-}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
